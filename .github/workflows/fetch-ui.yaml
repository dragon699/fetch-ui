name: fetch-ui
run-name: Deploy fetch-ui

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "dragon699/home-k8s/fetch-ui"
  APP_REPO: "dragon699/home-k8s"
  APP_DEPLOYMENT_FILE: "manifests/apps/fetch-ui/fetch-ui.yaml"



jobs:

  Build:
    runs-on: gha-runner-fetch-ui
    outputs:
      version: ${{ steps.image_version.outputs.VERSION }}

    steps:
    - name: Fetch code
      uses: actions/checkout@v6

    - name: Inspect version
      id: image_version
      run: |
        VERSION_FILE=VERSION
        VERSION=$(cat ${VERSION_FILE})

        if [ $? -ne 0 ] || [ -z "$VERSION" ]; then
          echo "${VERSION_FILE}: Failed to fetch version from file!"

          exit 1
        fi

        echo "VERSION=${VERSION}" >> ${GITHUB_OUTPUT}
        echo "Target image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"

    - name: Prepare registry auth
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_version.outputs.VERSION }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest



  Deploy:
    runs-on: gha-runner-fetch-ui
    needs: Build
    timeout-minutes: 5

    steps:
    - name: Fetch devops code
      uses: actions/checkout@v6
      with:
        repository: ${{ env.APP_REPO }}
        token: ${{ secrets.APP_REPO_TOKEN }}
        fetch-depth: 0
        ref: main

    - name: Fetch latest changes
      run: |
        git config user.name "ActionsBot"
        git fetch origin main
        git pull --rebase origin main

    - name: Bump version
      uses: mikefarah/yq@master
      with:
        cmd: yq -i '.spec.template.spec.containers[0].image = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.Build.outputs.version }}"' ${{ env.APP_DEPLOYMENT_FILE }}

    - name: Sync changes
      id: deployment_changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "fetch-ui: Bump to v${{ needs.Build.outputs.version }}"
        commit_user_name: ActionsBot
        file_pattern: ${{ env.APP_DEPLOYMENT_FILE }}
        push_options: --force-with-lease

    - name: Deploy
      if: steps.deployment_changes.outputs.changes_detected == 'true'
      env:
        APP: fetch-ui
      run: |
        set -euo pipefail

        SA=/var/run/secrets/kubernetes.io/serviceaccount
        URL="https://kubernetes.default.svc/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/${APP}"
        kube() { curl -sS --fail-with-body --cacert "$SA/ca.crt" -H "Authorization: Bearer $(cat "$SA/token")" "$@"; }

        # Wait for a running operation (e.g. an auto-sync) to finish first
        for i in $(seq 1 60); do
          [ "$(kube "$URL" | jq -r '.operation != null')" = "false" ] && break
          echo "Waiting for the current operation on ${APP} to finish..."
          sleep 5
        done

        # A sync requested this way doesn't inherit the app's syncOptions (e.g. ServerSideApply)
        PATCH=$(kube "$URL" | jq -c '{operation: {
          initiatedBy: {username: "github-actions"},
          sync: {prune: false, syncOptions: (.spec.syncPolicy.syncOptions // [])},
          retry: {limit: 15, backoff: {duration: "10s", factor: 1, maxDuration: "10s"}}
        }}')

        STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        kube -X PATCH -H "Content-Type: application/merge-patch+json" "$URL" -d "$PATCH" >/dev/null
        echo "Sync of ${APP} requested on $(TZ=Europe/Sofia date +'%d/%m at %H:%M:%S')"

        for i in $(seq 1 100); do
          read -r STARTED_AT PHASE < <(kube "$URL" | jq -r '[.status.operationState.startedAt // "", .status.operationState.phase // ""] | @tsv')
          if [[ ! "$STARTED_AT" < "$STARTED" ]] && [[ "$PHASE" =~ ^(Succeeded|Failed|Error)$ ]]; then
            FINISHED=$(kube "$URL" | jq -r '.status.operationState.finishedAt')
            kube "$URL" | jq -r '"\(.status.operationState.phase): \(.status.operationState.message)",
              "sync: \(.status.sync.status), health: \(.status.health.status)"'
            echo "Finished on $(TZ=Europe/Sofia date -d "$FINISHED" +'%d/%m at %H:%M:%S')"
            [ "$PHASE" = "Succeeded" ] && exit 0 || exit 1
          fi
          sleep 5
        done
        echo "Timed out waiting for the sync of ${APP}"
        exit 1
